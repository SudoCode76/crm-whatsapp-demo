<div class="shell-layout">
  <div class="sidebar-wrapper">
    <app-sidebar
      [items]="navItems()"
      [user]="user()"
      [collapsed]="isSidebarCollapsed()"
      [mobileOpen]="isSidebarMobileOpen()"
      (logout)="logout()"
      (toggle)="onSidebarToggleRequest($event)"
      (closeMobile)="closeSidebarMobile()"
    ></app-sidebar>
  </div>
  <!-- The floating handle is rendered into document.body from the component to avoid
       being clipped by transformed/overflowing ancestors. The template handle was
       removed to prevent duplicate controls. -->
  @if (isSidebarMobileOpen()) {
    <div class="fixed inset-0 bg-black/40 z-30 md:hidden" (click)="closeSidebarMobile()"></div>
  }

  <!-- Main area: header + scrollable content -->
  <main class="shell-main">
    <!-- Topbar -->
    <header class="topbar">
      <div
        class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-white/80 to-transparent"
      ></div>

      <!-- Lado izquierdo: botón hamburguesa (solo móvil) + título -->
      <div class="flex items-center gap-2 min-w-0">
        <button
          class="md:hidden flex-shrink-0 w-9 h-9 bg-white/30 rounded-full flex items-center justify-center border border-white/50 text-slate-600 hover:bg-white/50 transition-colors"
          (click)="openSidebarMobile()"
          aria-label="Abrir menú"
          type="button"
        >
          <span class="material-symbols-outlined text-[22px]">menu</span>
        </button>
        <h2 class="text-lg font-semibold text-slate-800 truncate">{{ pageTitle() }}</h2>
      </div>

      <!-- Lado derecho: fecha + notificaciones -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <div
          class="hidden sm:flex px-4 py-1.5 bg-white/30 backdrop-blur-md rounded-full border border-white/60 shadow-sm items-center gap-2"
        >
          <span class="material-symbols-outlined text-[18px] text-slate-600">calendar_today</span>
          <span class="text-sm font-medium text-slate-700">{{ today }}</span>
        </div>
        <button
          class="w-8 h-8 bg-white/30 rounded-full flex items-center justify-center border border-white/50 text-slate-600 hover:bg-white/50 transition-colors shadow-sm relative"
          aria-label="Notificaciones"
          type="button"
        >
          <span class="material-symbols-outlined text-[20px]">notifications</span>
          <span
            class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border border-white"
          ></span>
        </button>
      </div>
    </header>

    <!-- Page content -->
    <div class="page-content">
      <router-outlet />
    </div>
  </main>
</div>
