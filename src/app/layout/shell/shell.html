<div class="shell-layout">
  <div class="sidebar-wrapper">
    <app-sidebar
      [items]="navItems()"
      [user]="user()"
      [collapsed]="isSidebarCollapsed()"
      [mobileOpen]="isSidebarMobileOpen()"
      (logout)="logout()"
      (toggle)="onSidebarToggleRequest($event)"
      (closeMobile)="closeSidebarMobile()"
    ></app-sidebar>
  </div>
  <!-- The floating handle is rendered into document.body from the component to avoid
       being clipped by transformed/overflowing ancestors. The template handle was
       removed to prevent duplicate controls. -->
  @if (isSidebarMobileOpen()) {
    <div class="fixed inset-0 bg-black/40 z-30 md:hidden" (click)="closeSidebarMobile()"></div>
  }

  <!-- Main area: header + scrollable content -->
  <main class="shell-main">
    <!-- Topbar removed globally per design request -->

    <!-- Page content -->
    <div class="page-content">
      <div class="page-inner">
        <router-outlet />
      </div>
    </div>
  </main>
</div>
