<aside
  class="relative z-20 w-[240px] min-w-[240px] h-screen bg-white/[0.12] backdrop-blur-[48px] border-r border-white/40 shadow-[4px_0_24px_0_rgba(31,38,135,0.05)] flex flex-col overflow-hidden"
>
  <!-- Brand -->
  <div class="px-5 py-5 flex items-center gap-3 flex-shrink-0">
    <div
      class="w-10 h-10 bg-white/40 backdrop-blur-[12px] rounded-xl flex items-center justify-center border border-white/60 shadow-[inset_0_1px_1px_rgba(255,255,255,0.8)] flex-shrink-0"
    >
      <span class="material-symbols-outlined text-[22px] brand-icon">chat_bubble</span>
    </div>
    <h1 class="text-xl font-bold text-slate-800 tracking-tight truncate">CobraBot</h1>
  </div>

  <!-- Nav -->
  <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto overflow-x-hidden">
    @for (item of itemsSignal(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="nav-item--active"
        class="nav-item flex items-center gap-3 px-3 py-2.5 text-slate-600 font-medium hover:bg-white/20 rounded-lg transition-colors border border-transparent hover:border-white/30 w-full min-w-0"
      >
        <span class="material-symbols-outlined text-slate-500 nav-icon flex-shrink-0 text-[20px]">{{
          item.icon
        }}</span>
        <span class="truncate text-sm leading-tight">{{ item.label }}</span>
        @if (item.badge && item.badge > 0) {
          <span
            class="ml-auto flex-shrink-0 bg-emerald-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full"
            >{{ item.badge }}</span
          >
        }
      </a>
    }
  </nav>

  <!-- User footer -->
  <div class="px-3 py-3 flex-shrink-0">
    <div
      class="flex items-center gap-2 px-3 py-3 bg-white/20 backdrop-blur-md rounded-xl border border-white/40 min-w-0"
    >
      <div
        class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-400 to-emerald-300 shadow-sm border border-white flex items-center justify-center text-white font-bold text-xs flex-shrink-0"
      >
        {{ user()?.avatar ?? 'AG' }}
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-slate-800 truncate">
          {{ user()?.nombre ?? 'Admin General' }}
        </p>
        <p class="text-xs text-slate-500 truncate">{{ user()?.email ?? '' }}</p>
      </div>
      <button
        class="text-slate-500 hover:text-slate-800 transition-colors text-sm flex-shrink-0"
        (click)="onLogout()"
        aria-label="Cerrar sesión"
      >
        ↪
      </button>
    </div>
  </div>
</aside>
