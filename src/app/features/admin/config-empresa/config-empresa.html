<div class="ce-page">
  <!-- Header -->
  <div class="ce-header">
    <h1 class="ce-title">Configuración de Empresa</h1>
    <p class="ce-subtitle">Administra la información y datos de tu empresa</p>
  </div>

  <!-- Logo & Name card -->
  <div class="ce-card glass">
    <div class="ce-card-header">
      <h2 class="ce-card-title">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M2.25 21h19.5m-18-18v18m10.5-18v18m6-13.5V21M6.75 6.75h.75m-.75 3h.75m-.75 3h.75m3-6h.75m-.75 3h.75m-.75 3h.75M6.75 21v-3.375c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21M3 3h12m-.75 4.5H21m-3.75 3.75h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008zm0 3h.008v.008h-.008v-.008z"
          />
        </svg>
        Información de la Empresa
      </h2>
    </div>

    <div class="ce-logo-row">
      <!-- Avatar logo -->
      <div class="ce-logo-wrap">
        <div class="ce-logo-avatar">CB</div>
        <button class="ce-logo-btn" type="button" aria-label="Cambiar logo">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"
            />
          </svg>
        </button>
      </div>
      <div class="ce-logo-info">
        <p class="ce-logo-hint">Logo de la empresa</p>
        <p class="ce-logo-hint-sub">PNG, JPG hasta 2MB. Recomendado 200×200px</p>
      </div>
    </div>

    <form class="ce-form" (ngSubmit)="guardar()">
      <div class="ce-form-grid">
        <div class="ce-field">
          <label class="ce-label">Nombre de la empresa</label>
          <input
            class="ce-input"
            type="text"
            placeholder="CobraBot Bolivia S.R.L."
            [value]="nombre()"
            (input)="nombre.set($any($event.target).value)"
          />
        </div>
        <div class="ce-field">
          <label class="ce-label">NIT / RUC</label>
          <input
            class="ce-input"
            type="text"
            placeholder="1234567-K"
            [value]="nit()"
            (input)="nit.set($any($event.target).value)"
          />
        </div>
        <div class="ce-field">
          <label class="ce-label">Correo electrónico</label>
          <input
            class="ce-input"
            type="email"
            placeholder="info@cobrabot.bo"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
          />
        </div>
        <div class="ce-field">
          <label class="ce-label">Teléfono</label>
          <input
            class="ce-input"
            type="text"
            placeholder="+591 2 000-0000"
            [value]="telefono()"
            (input)="telefono.set($any($event.target).value)"
          />
        </div>
        <div class="ce-field ce-field--full">
          <label class="ce-label">Dirección</label>
          <input
            class="ce-input"
            type="text"
            placeholder="Calle Comercio 123, La Paz"
            [value]="direccion()"
            (input)="direccion.set($any($event.target).value)"
          />
        </div>
        <div class="ce-field ce-field--full">
          <label class="ce-label">Número WhatsApp Business</label>
          <div class="ce-input-group">
            <span class="ce-input-prefix">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="currentColor"
              >
                <path
                  d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
                />
              </svg>
            </span>
            <input
              class="ce-input ce-input--prefixed"
              type="text"
              placeholder="+591 7 000-0000"
              [value]="waNum()"
              (input)="waNum.set($any($event.target).value)"
            />
          </div>
        </div>
      </div>

      @if (saved()) {
        <p class="ce-saved-msg">Cambios guardados correctamente.</p>
      }

      <div class="ce-form-actions">
        <button type="button" class="ce-btn-secondary">Cancelar</button>
        <button type="submit" class="ce-btn-primary">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"
            />
          </svg>
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
