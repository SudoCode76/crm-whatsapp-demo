<div class="page">
  <header class="page-header">
    <h1 class="page-title">Clientes</h1>
    <a routerLink="/clients/new" class="btn-primary">+ Nuevo cliente</a>
  </header>

  <div class="table-wrap glass">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Empresa</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for (c of clients(); track c.id) {
          <tr>
            <td>{{ c.nombre }}</td>
            <td>{{ c.telefono }}</td>
            <td>{{ c.empresa ?? '—' }}</td>
            <td>
              <span
                class="badge"
                [class.badge--active]="c.activo"
                [class.badge--inactive]="!c.activo"
              >
                {{ c.activo ? 'Activo' : 'Inactivo' }}
              </span>
            </td>
            <td><a [routerLink]="['/clients', c.id]" class="link">Ver</a></td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
